stages:
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  common_script: &common_script
    - npm install --force
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

.deploy: &deploy
  script:
    - *common_script
    - deploy_brands $kubeconfig $namespace $yaml_file

deploy:
  variables:
    kubeconfig: $kubeconfig_dev
    namespace: dev
    yaml_file: brands_dev.yaml
  extends: .deploy

deploy-staging:
  variables:
    kubeconfig: $kubeconfig_staging
    namespace: staging
    yaml_file: brands_staging.yaml
  extends: .deploy

deploy-prod:
  variables:
    kubeconfig: $kubeconfig_prod
    namespace: prod
    yaml_file: brands_prod.yaml
  extends: .deploy

before_script:
  - *common_script
  - load_yaml_content $yaml_file

script:
  - echo "Deploying brands for $namespace environment..."
  - deploy_brands $kubeconfig $namespace $yaml_file
  - echo "Brands deployment completed for $namespace environment."

environment:
  name: development

only:
  - develop
  - release/current
  - master
  - branches

branches:
  only:
    - develop
    - release/*
    - master
  except:
    - tags
    - triggers

load_yaml_content: &load_yaml_content
  - YAML_CONTENT=$(cat $1)

deploy_brands: &deploy_brands
  for ((index=0; index<=total_brands; index++)); do
    deploy=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].deploy" -)
    site=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].site" -)
    lang=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].lang" -)
    brand=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].brand" -)

    image_tag="pgtgs/${deploy}:$Tag"
    
    npm run gitlab-build -- BRAND=${brand} API_URL=/ SITE=${site} DEFAULT_LANGUAGE=${lang} vite build -m prod
    echo "image_tag=$image_tag"
    
    docker build -t $image_tag .
    docker push $image_tag
    kubectl set image deployment/$deploy $deploy=$image_tag -n $kube_ns
    echo "=============="
  done
