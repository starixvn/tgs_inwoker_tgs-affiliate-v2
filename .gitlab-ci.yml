variables:
  ImageName: pgtgs/agent-v2
  BRAND: GPI-V2
  SITE: https://t1.srvptt.com/
  LANG: zh-CN
  DEPLOY: agent-gpi-v2

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - echo "Tag=$Tag"

stages:
  - npm-build
  - docker-build
  - deploy-staging
  - deploy-prod

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

npm-build:
  image: node:latest
  stage: npm-build
  script:
    - npm install
    - echo "BRAND=$BRAND"
    - echo "SITE=$SITE"
    - echo "DEFAULT_LANGUAGE=$LANG"
    - echo "Tag=$Tag"
    - echo "$Tag" > tag_file
    - npm run gitlab-build -- BRAND=$BRAND API_URL=/ SITE=$SITE DEFAULT_LANGUAGE=$LANG vite build -m prod
  artifacts:
    paths:
      - ./dist
      - tag_file
#https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
#https://forum.gitlab.com/t/error-cannot-perform-an-interactive-login-from-a-non-tty-device/59936/4
#https://docs.gitlab.com/ee/user/clusters/agent/ci_cd_workflow.html

docker-build:
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  stage: docker-build
  needs:
  - job: npm-build
    artifacts: true
  before_script:
    - export Tag=$(cat tag_file)
    - docker login -u $docker_user -p $docker_pwd
  script:
    - echo "Tag=$Tag"
    - echo "BRAND=$BRAND"
    - docker build -t ${ImageName}:$Tag .
    - docker push ${ImageName}:$Tag
  artifacts:
    paths:
      - ./dist
      
deploy-staging:
  stage: deploy-staging
  needs:
    - job: npm-build
      artifacts: true
    - job: docker-build
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
    - echo "kubeconfig_dev=$kubeconfig_dev"
    - echo "kubeconfig_staging=$kubeconfig_staging"
  script:
    - export Tag=$(cat tag_file)
    - echo "DEPLOY=$DEPLOY"
    - echo "ImageName=$ImageName"
    - echo "Tag=$Tag"
    - kubectl config get-contexts
    - kubectl set image deployment/$DEPLOY $DEPLOY=${ImageName}:$Tag --record -n staging
    - echo "Deployment successful"
  environment:
    name: staging
  only: 
    - develop
#https://gitlab.com/gitlab-org/cluster-integration/helm-install-image   
deploy-prod:
  stage: deploy-prod
  needs:
    - job: npm-build
      artifacts: true
    - job: docker-build
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  before_script:
    - export KUBECONFIG=$kubeconfig_prod
  script:
    - export Tag=$(cat tag_file)
    - echo "DEPLOY=$DEPLOY"
    - echo "ImageName=$ImageName"
    - echo "Tag=$Tag"
    - kubectl set image deployment/$DEPLOY $DEPLOY=${ImageName}:${Tag} --record -n prod
    - echo "Deployment successful"
  only: 
    - master