image: node:latest

variables:
  ImageName: pgtgs/agent-v2
  BRAND: GPIHKD
  API_URL: https://stg-gpi-hkd.rpgp.cc/
  LANG: zh-CN
  DEPLPOY: agent-gpihkd

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

stages:
  - npm-build
  - docker-build
  - deploy-staging
  - deploy-prod

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

npm-build:
  image: node:latest
  stage: npm-build
  script:
    - npm install
    - echo "BRAND=$BRAND"
    - echo "SITE=$SITE"
    - echo "DEFAULT_LANGUAGE=$LANG"
    - npm run build --BRAND=$BRAND --API_URL=/ --SITE=$SITE --DEFAULT_LANGUAGE=$LANG
  artifacts:
    paths:
      - dist/
#https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
#https://forum.gitlab.com/t/error-cannot-perform-an-interactive-login-from-a-non-tty-device/59936/4
#https://docs.gitlab.com/ee/user/clusters/agent/ci_cd_workflow.html
docker-build:
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
  stage: docker-build
  before_script:
    - docker login -u $docker_user -p $docker_pwd
    - docker info
  script:
    - echo "Tag=$Tag"
    - docker build -t ${ImageName}:$Tag .
    - docker push ${ImageName}:$Tag
  artifacts:
    paths:
      - dist/
      
deploy-staging:
  stage: deploy-staging
  needs:
    - npm-build
    - docker-build
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - kubectl config get-contexts
    - kubectl set image deployment/$DEPLPOY $DEPLPOY=${ImageName}:$Tag --record -n staging
    - echo "Deployment successful"
  environment:
    name: staging
  only: 
    - develop
#https://gitlab.com/gitlab-org/cluster-integration/helm-install-image   
deploy-prod:
  stage: deploy-prod
  needs:
    - npm-build
    - docker-build
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  script:
    - helm version
    - kubectl set image deployment/$DEPLPOY $DEPLPOY=${ImageName}:${Tag} --record -n prod
    - echo "Deployment successful"
  only: 
    - master
  when: manual