deploy-dev:
  stage: deploy-dev
  needs:
    - job: npm-build
      artifacts: true
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  variables:
    kube_ns: dev
  before_script:
    - export KUBECONFIG=$kubeconfig_dev
    - apt-get update -qy
    - apt-get install -y yq
    - ORIGINAL_CONTENT=$(cat brands_dev.yaml)
    - export data=$(echo "$ORIGINAL_CONTENT" | yq)
    - echo $data
  script: 
    - |
      for (i = 0;i <  data.brands.size(); i++) {
        
          deploy="${data.brands[i].deploy}"
          image_tag="pgtgs/${data.brands[i].deploy}:$Tag"
          
          sh "npm run gitlab-build -- BRAND=${data.brands[i].brand} API_URL=/ SITE=${data.brands[i].site} DEFAULT_LANGUAGE=${data.brands[i].lang} vite build -m prod"
          echo "image_tag=$image_tag"
          
          sh "docker build -t $image_tag ."
          sh "docker push $image_tag"
          sh "kubectl set image deployment/$deploy $deploy=$image_tag -n $kube_ns"
          
          sh "echo '=============='"
      }
  environment:
    name: develop
  only: 
    - develop

deploy-staging:
  stage: deploy-staging
  needs:
    - job: npm-build
      artifacts: true
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
    - echo "kubeconfig_dev=$kubeconfig_dev"
    - echo "kubeconfig_staging=$kubeconfig_staging"
  script:
    - export Tag=$(cat tag_file)
    - echo "deploy=$deploy"
    - echo "ImageName=$ImageName"
    - echo "Tag=$Tag"
    - kubectl config get-contexts
    - kubectl set image deployment/$deploy $deploy=${ImageName}:$Tag --record -n staging
    - echo "Deployment successful"
  environment:
    name: staging
  only: 
    - release/current
#https://gitlab.com/gitlab-org/cluster-integration/helm-install-image   
deploy-prod:
  stage: deploy-prod
  needs:
    - job: npm-build
      artifacts: true
  image: 
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  before_script:
    - export KUBECONFIG=$kubeconfig_prod
  script:
    - export Tag=$(cat tag_file)
    - echo "deploy=$deploy"
    - echo "ImageName=$ImageName"
    - echo "Tag=$Tag"
    - kubectl set image deployment/$deploy $deploy=${ImageName}:${Tag} --record -n prod
    - echo "Deployment successful"
  only: 
    - master