variables:
  ImageName: pgtgs/agent-v2
  deploy: agent-pito7-v2
  brand: GPI-V2
  site: https://pitopito7.com/
  lang: zh-CN
  
default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - echo "Tag=$Tag"

stages:
  - npm-build
#  - docker-build
  - deploy-dev
  - deploy-staging
  - deploy-prod

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

npm-build:
  image: node:latest
  stage: npm-build
  script:
    - npm install
    - echo "brand=$brand"
    - echo "site=$site"
    - echo "lang=$lang"
    - echo "Tag=$Tag"
    - echo "$Tag" > tag_file
  artifacts:
    paths:
      - ./dist
      - tag_file
#https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
#https://forum.gitlab.com/t/error-cannot-perform-an-interactive-login-from-a-non-tty-device/59936/4
#https://docs.gitlab.com/ee/user/clusters/agent/ci_cd_workflow.html


