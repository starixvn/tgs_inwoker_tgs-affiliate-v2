.default-template: &default-template
  before_script:
    - echo "Tag=${CI_COMMIT_REF_NAME}-$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

.cache-template: &cache-template
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

stages:
  - npm-build
  - deploy

npm-build:
  image: node:latest
  stage: npm-build
  <<: *default-template
  <<: *cache-template
  script:
    - npm install
    - echo "brand=$brand"
    - echo "site=$site"
    - echo "lang=$lang"
    - echo "Tag=${CI_COMMIT_REF_NAME}-$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - echo "${CI_COMMIT_REF_NAME}-$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID" > tag_file
  artifacts:
    paths:
      - ./dist
      - tag_file

.deploy-template: &deploy-template
  script:
    - export Tag=$(cat tag_file)
    - YAML_CONTENT=$(cat $YAML_FILE)
    - total_brands=$(echo "$YAML_CONTENT" | yq '.brands | length - 1')
    - |
      for ((index=0; index<=total_brands; index++)); do
        deploy=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].deploy" -)
        site=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].site" -)
        lang=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].lang" -)
        brand=$(echo "$YAML_CONTENT" | yq eval ".brands[$index].brand" -)
        
        image_tag="pgtgs/${deploy}:${Tag}"
        
        npm run gitlab-build -- BRAND=${brand} API_URL=/ SITE=${site} DEFAULT_LANGUAGE=${lang} vite build -m prod
        echo "image_tag=${image_tag}"
        
        docker build -t ${image_tag} .
        docker push ${image_tag}
        kubectl set image deployment/${deploy} ${deploy}=${image_tag} -n ${kube_ns}
        echo "=============="
      done

.deploy:
  stage: deploy
  needs:
    - job: npm-build
      artifacts: true
  image:
    name: bitnami/kubectl:1.26
    entrypoint: [""]
  environment:
    name: $ENV
  rules:
    - exists:
        - "master"
      changes:
        - "**/*.yaml"
    - exists:
        - ".gitlab-ci.yml"
  before_script:
    - export KUBECONFIG=$kubeconfig_$ENV
  <<: *deploy-template

deploy-dev:
  <<: *deploy

deploy-staging:
  <<: *deploy

deploy-prod:
  <<: *deploy
  only: 
    - master
  when: manual