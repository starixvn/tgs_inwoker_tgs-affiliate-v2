#https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
#https://forum.gitlab.com/t/error-cannot-perform-an-interactive-login-from-a-non-tty-device/59936/4
#https://docs.gitlab.com/ee/user/clusters/agent/ci_cd_workflow.html
variables:
  config: "kubeconfig"
stages:
  - deploy
.deploy-template: &deploy-template
  stage: deploy
  image: 
    name: bitnami/kubectl:1.28
    entrypoint: [""]
  script:
    - | 
      source get_tgs-env.sh
      export tgs_env=$(get_environment "$CI_COMMIT_REF_NAME")
      export KUBECONFIG="${config}_${tgs_env}"
      echo "KUBECONFIG=$KUBECONFIG"
      export KUBECONFIG=${!KUBECONFIG}
      echo "KUBECONFIG=$KUBECONFIG"
      export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

      if [[ $TOKEN == "" ]]; then
          export file="brands_${tgs_env}.yaml"
          YAML_CONTENT=$(cat ${file})
          total_brands=$(yq e '.brands | length' $file)
          echo "total_brands=$total_brands"
          deploy_brands
      else 
          echo "BRAND=$BRAND"
          echo "SITE=$SITE"
          echo "LANG=$LANG"
          npm run gitlab-build -- BRAND=$BRAND API_URL=/ --SITE=$SITE DEFAULT_LANGUAGE=$LANG vite build -m prod
          lowercase_brand=$(echo "$BRAND" | tr '[:upper:]' '[:lower:]')
          echo "lowercase_brand=$lowercase_brand"
          image="pgtgs/agent-$lowercase_brand:$tag"
          docker build -t $image .
          docker push $image
          
          envsubst < deployment/agent-${tgs_env}.yaml 
          envsubst < deployment/agent-${tgs_env}.yaml  | kubectl apply -f -
      fi

deploy-dev:
  <<: *deploy-template
  environment:
    name: dev
  only: 
    - develop

deploy-staging:
  <<: *deploy-template
  environment:
    name: staging
  only: 
    - release/current
  rules:

deploy-prod:
  <<: *deploy-template
  environment:
    name: prod
  only: 
    - master