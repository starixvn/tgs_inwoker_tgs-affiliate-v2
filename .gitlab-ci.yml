image: node:latest

variables:
  ImageName: pgtgs/agent-v2

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

stages:
  - npm-build
  - docker-build
  - deploy-staging
  - deploy-prod

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

npm-build:
  image: node:latest
  stage: npm-build
  script:
    - npm install
    - echo "BRAND=$BRAND"
    - echo "SITE=$SITE"
    - echo "DEFAULT_LANGUAGE=$LANG"
    - npm run build --BRAND=$BRAND --API_URL=/ --SITE=$SITE --DEFAULT_LANGUAGE=$LANG
  artifacts:
    paths:
      - dist/
#https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
docker-build:
  image: $CI_REGISTRY/group/project/docker:20.10.16
  services:
    - name: $CI_REGISTRY/group/project/docker:20.10.16-dind
      alias: docker
  stage: docker-build
  before_script:
    - docker login -u $docker_user -p $docker_pwd
    - docker info
  script:
    - docker build -t ${ImageName}:${Tag} .
    - docker push ${ImageName}:${Tag}
  artifacts:
    paths:
      - dist/
      
deploy-staging:
  stage: deploy-staging
  needs:
    - npm-build
    - docker-build
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  before_script:
    - export KUBECONFIG=$kubeconfig_staging
  script:
    - echo "Running deploy"
    - helm template $BRAND
  only: 
    - develop
    
deploy-prod:
  stage: deploy-prod
  needs:
    - npm-build
    - docker-build
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  script:
    - echo "Running deploy"
    - aws s3 cp ./dist s3://$S3_BUCKET/ --recursive
    - echo "Deployment successful"
  only: 
    - master
  when: manual