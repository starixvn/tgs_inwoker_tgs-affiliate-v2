        echo "image_tag=$image_tag"
        
        docker build -t $image_tag .
        docker push $image_tag
        kubectl set image deployment/$deploy $deploy=$image_tag -n $kube_ns
        echo "=============="
      done
  only: 
    - master
  when: manual  